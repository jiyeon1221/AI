<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>autoTB · HV Check</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif;
               background: #0f1117; color: #dde1f0; }
  body { display: flex; flex-direction: column; }

  /* ── Top bar ── */
  #top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid #2c2f3e; background: #1a1d27;
    flex-shrink: 0;
  }
  #top-left { display: flex; align-items: center; gap: 10px; }
  #top-left img { height: 22px; }
  #top-title { font-size: 14px; font-weight: 600; color: #4f8ef7; }
  #top-right { display: flex; align-items: center; gap: 8px; }
  #timestamp { font-size: 11px; color: #7a7f99; min-width: 170px; text-align: right; }

  button {
    background: #23273a; color: #dde1f0;
    border: 1px solid #3a4159; border-radius: 4px;
    padding: 5px 11px; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: #4f8ef7; color: #fff; }
  button.active { background: #2a3a5e; border-color: #4f8ef7; color: #4f8ef7; }

  /* ── Content area ── */
  #content { flex: 1; overflow: auto; padding: 12px 14px; }

  /* ── Error / loading ── */
  #msg { font-size: 13px; color: #9ca0b8; padding: 20px 0; }
  #msg.error { color: #f44336; }

  /* ── Table view ── */
  #tbl-wrap { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse; font-size: 12px;
    table-layout: fixed;
  }
  colgroup .col-ch     { width: 52px; }
  colgroup .col-name   { width: 90px; }
  colgroup .col-status { width: 70px; }
  colgroup .col-exp    { width: 78px; }
  colgroup .col-num    { width: 78px; }

  thead th {
    background: #1a1d27; color: #7a7f99; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px; font-size: 10px;
    padding: 7px 10px; text-align: right; border-bottom: 1px solid #2c2f3e;
    white-space: nowrap;
  }
  thead th:nth-child(1), thead th:nth-child(2) { text-align: left; }
  thead th:nth-child(3) { text-align: center; }

  tbody tr { border-bottom: 1px solid #1e2233; }
  tbody tr:hover { background: #1e2233; }
  tbody tr.trip-row { background: #2a0f14; }
  tbody tr.trip-row:hover { background: #35131a; }
  tbody td {
    padding: 6px 10px; font-family: 'SF Mono','Fira Code',monospace;
    font-size: 12px; text-align: right; white-space: nowrap;
  }
  tbody tr.trip-row td { color: #ff8a9a; }
  tbody td:nth-child(1) { text-align: left; color: #7a7f99; }
  tbody td:nth-child(2) { text-align: left; color: #dde1f0; font-weight: 600; }
  tbody td:nth-child(3) { text-align: center; }

  /* Status badge */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600;
  }
  .badge-on   { background: #2c2c2c; color: #f2f2f2; }
  .badge-off  { background: #2a2a2a; color: #ffffff; }
  .badge-up   { background: #2c2c2c; color: #f1f1f1; }
  .badge-down { background: #2c2c2c; color: #efefef; }
  .badge-trip { background: #5a0000; color: #ff1744; }
  .badge-unk  { background: #1f2235; color: #7a7f99; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot-on   { background: #f2f2f2; }
  .dot-off  { background: #ffffff; }
  .dot-up   { background: #f1f1f1; }
  .dot-down { background: #efefef; }
  .dot-trip { background: #ff1744; }
  .dot-unk  { background: #7a7f99; }

  /* VMon deviation highlight */
  .vmon-warn { color: #dde1f0; }
  .vmon-ok   { color: #dde1f0; }

  /* ── Raw view ── */
  #raw {
    font-family: 'SF Mono','Fira Code','Courier New',monospace;
    font-size: 12px; line-height: 1.5; color: #c5cae9;
    background: #0a0c14; border-radius: 4px;
    padding: 12px; white-space: pre-wrap; word-break: break-word;
  }
  .hidden { display: none; }

  /* ── Edit mode ── */
  /* V0Set cell — editable in edit mode */
  tbody td.v0set-cell {
    cursor: pointer; position: relative; outline: none;
  }
  tbody td.v0set-cell:hover { background: #252840; }
  tbody td.v0set-cell:focus {
    background: #1e2850;
    box-shadow: inset 0 0 0 1px #4f8ef7;
  }
  tbody td.v0set-cell::after {
    content: ' ✎'; font-size: 10px; color: #4f8ef780; font-style: normal;
  }
  tbody td.v0set-cell input.inline-edit {
    width: 72px; background: #1a1d27; color: #fff;
    border: 1px solid #4f8ef7; border-radius: 3px;
    padding: 1px 4px; font-size: 12px; font-family: inherit;
    text-align: right;
  }
  /* Status cell — clickable for on/off in edit mode */
  tbody td.status-edit { cursor: pointer; outline: none; }
  tbody td.status-edit:hover .badge { opacity: 0.75; }
  tbody td.status-edit:focus { box-shadow: inset 0 0 0 1px #4f8ef7; }

  /* ── Row keyboard-focus highlight ── */
  tbody tr:focus-within { background: #1a2240 !important; }
  tbody tr.trip-row:focus-within { background: #3a1020 !important; }


  /* ── Confirm modal ── */
  #modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); z-index: 100;
    align-items: center; justify-content: center;
  }
  #modal-overlay.visible { display: flex; }
  #modal-box {
    background: #1a1d27; border: 1px solid #4f8ef7; border-radius: 8px;
    padding: 20px 24px; min-width: 320px; max-width: 480px;
  }
  #modal-title { font-size: 14px; font-weight: 600; color: #4f8ef7; margin-bottom: 10px; }
  #modal-body  { font-size: 12px; color: #9ca0b8; line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; }
  #modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  #modal-confirm { background: #1e3a6e; border-color: #4f8ef7; color: #4f8ef7; padding: 6px 18px; }
  #modal-confirm:hover { background: #2a4f9e; color: #fff; }
  #modal-cancel  { background: #23273a; border-color: #3a4159; color: #7a7f99; padding: 6px 18px; }

  /* ── Toast ── */
  #toast {
    display: none; position: fixed; bottom: 20px; right: 20px; z-index: 200;
    background: #23273a; border: 1px solid #3a4159; border-radius: 6px;
    padding: 10px 16px; font-size: 12px; color: #dde1f0;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  #toast.ok    { border-color: #4caf50; color: #4caf50; }
  #toast.error { border-color: #ef5350; color: #ef5350; }

  /* ── Trip Alert Banner ── */
  #trip-banner {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: #7a0000; border-bottom: 3px solid #ff1744;
    animation: trip-pulse 0.9s ease-in-out infinite;
  }
  #trip-banner.visible { display: block; }
  #trip-banner-inner {
    display: flex; align-items: center; gap: 16px; padding: 14px 20px;
  }
  #trip-banner-icon { font-size: 22px; flex-shrink: 0; }
  #trip-banner-label {
    font-size: 14px; font-weight: 800; color: #ff4444;
    letter-spacing: 2px; text-transform: uppercase; flex-shrink: 0;
  }
  #trip-banner-channels {
    flex: 1; font-size: 13px; color: #ffcdd2;
    font-family: 'SF Mono','Fira Code',monospace;
  }
  #trip-banner-close {
    flex-shrink: 0; background: transparent; border: 1px solid #ff5252;
    color: #ff5252; font-size: 12px; cursor: pointer;
    padding: 4px 12px; border-radius: 3px;
  }
  #trip-banner-close:hover { background: #ff1744; color: #fff; border-color: #ff1744; }
  @keyframes trip-pulse {
    0%, 100% { background: #7a0000; box-shadow: 0 3px 18px rgba(255,23,68,0.35); }
    50%       { background: #b71c1c; box-shadow: 0 3px 28px rgba(255,23,68,0.75); }
  }
</style>
</head>
<body>

<!-- Trip Alert Banner -->
<div id="trip-banner">
  <div id="trip-banner-inner">
    <span id="trip-banner-icon">⚡</span>
    <span id="trip-banner-label"></span>
    <span id="trip-banner-channels"></span>
    <button id="trip-banner-close">닫기 ✕</button>
  </div>
</div>

<div id="top">
  <div id="top-left">
    <img src="/static/DREAM_LOGO.png" alt="DREAM" />
    <span id="top-title">HV Status · All Channels</span>
  </div>
  <div id="top-right">
    <button id="view-btn">Raw 보기</button>
    <button id="expert-btn">전문가모드: 꺼짐</button>
    <button id="refresh-btn">새로고침</button>
    <button id="auto-btn" class="active">자동 갱신: 2초</button>
    <div id="timestamp">대기 중</div>
  </div>
</div>

<div id="content">
  <div id="msg">로딩 중...</div>
<div id="tbl-wrap" style="display:none">
    <table id="hv-table">
      <colgroup>
        <col class="col-ch" /><col class="col-name" /><col class="col-status" />
        <col class="col-num" /><col class="col-num" />
        <col class="col-num" /><col class="col-num" />
        <col class="col-exp" /><col class="col-exp" /><col class="col-exp" />
      </colgroup>
      <thead>
        <tr>
          <th>Ch</th><th>Name</th><th>Status</th>
          <th>VMon (V)</th><th>IMon (uA)</th>
          <th>V0Set (V)</th><th>I0Set (uA)</th>
          <th class="expert-col hidden">RUp (V/s)</th>
          <th class="expert-col hidden">RDown (V/s)</th>
          <th class="expert-col hidden">VMax (V)</th>
        </tr>
      </thead>
      <tbody id="hv-tbody"></tbody>
    </table>
  </div>
  <pre id="raw" style="display:none"></pre>

  <!-- Hodoscope HV card -->
  <div id="hodo-card" style="
    margin-top: 14px; padding: 12px 14px;
    background: #1a1d27; border: 1px solid #2c2f3e; border-radius: 6px;
    font-size: 12px; max-width: 320px;
  ">
    <div style="font-weight:600; color:#4f8ef7; margin-bottom:8px; font-size:11px;
                text-transform:uppercase; letter-spacing:0.5px;">
      Hodoscope HV (set file)
    </div>
    <div id="hodo-val" style="color:#9ca0b8;">로딩 중...</div>
  </div>
</div>

<!-- Confirm modal -->
<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-title">HV 변경 확인</div>
    <div id="modal-body"></div>
    <div id="modal-actions">
      <button id="modal-cancel">취소</button>
      <button id="modal-confirm">적용</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const msgEl      = document.getElementById('msg');
const tblWrap    = document.getElementById('tbl-wrap');
const tbody      = document.getElementById('hv-tbody');
const rawEl      = document.getElementById('raw');
const tsEl       = document.getElementById('timestamp');
const autoBtn    = document.getElementById('auto-btn');
const expertBtn  = document.getElementById('expert-btn');
const refreshBtn = document.getElementById('refresh-btn');
const viewBtn    = document.getElementById('view-btn');
const modalOverlay = document.getElementById('modal-overlay');
const modalBody    = document.getElementById('modal-body');
const modalConfirm = document.getElementById('modal-confirm');
const modalCancel  = document.getElementById('modal-cancel');
const toastEl      = document.getElementById('toast');

let timerAuto = null;
const AUTO_CHOICES = [1000, 2000, 5000]; // 1s / 2s / 5s
let autoIdx = 0; // default: 1000ms
let autoMs = AUTO_CHOICES[autoIdx];
let showRaw = false;
let lastRaw = '';
let lastRows = null;
let expertMode = false;
const isTrip    = s => s === 'trip' || s.includes('trip');
const KNOWN_ST  = new Set(['on', 'off', 'up', 'down']);
// + 기준으로 분리 후 KNOWN_ST 에 없는 부분이 하나라도 있으면 alert
const isAlertSt = s => s.split('+').map(c => c.trim().toLowerCase()).some(c => c !== '' && !KNOWN_ST.has(c));
// alert 조건만 추출 (KNOWN_ST 제외)
const alertParts = s => s.split('+').map(c => c.trim()).filter(c => c !== '' && !KNOWN_ST.has(c.toLowerCase()));
const editMode = true;   // 항상 편집 가능
let pendingAction = null;

/* ── Keyboard navigation state ── */
let focusedRowIdx = -1;
let focusedColKey = 'v0set'; // 'status' | 'v0set' | 'i0set'
const COL_TD_IDX = { name: 1, status: 2, v0set: 5, i0set: 6, rup: 7, rdown: 8, vmax: 9 };
// 좌우 화살표로 이동할 컬럼 순서 (모드별)
const COL_NAV_NORMAL = ['name', 'status', 'v0set', 'i0set'];
const COL_NAV_EXPERT = ['name', 'status', 'v0set', 'i0set', 'rup', 'rdown', 'vmax'];

function focusCell(rowIdx, colKey) {
  if (!editMode || !lastRows) return;
  const trs = tbody.querySelectorAll('tr');
  if (!trs.length) return;
  rowIdx = Math.max(0, Math.min(rowIdx, trs.length - 1));
  const td = trs[rowIdx].cells[COL_TD_IDX[colKey]];
  if (!td || td.tabIndex < 0) return;
  focusedRowIdx = rowIdx;
  focusedColKey = colKey;
  td.focus({ preventScroll: false });
  td.scrollIntoView({ block: 'nearest' });
}

/* ── Toast helper ── */
let toastTimer = null;
function showToast(msg, type = 'ok') {
  toastEl.textContent = msg;
  toastEl.className = type;
  toastEl.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, 3500);
}

/* ── Modal helper ── */
function showConfirm(message, onConfirm) {
  modalBody.textContent = message;
  modalOverlay.classList.add('visible');
  pendingAction = onConfirm;
}
modalConfirm.addEventListener('click', () => {
  modalOverlay.classList.remove('visible');
  if (pendingAction) { pendingAction(); pendingAction = null; }
});
modalCancel.addEventListener('click', () => {
  modalOverlay.classList.remove('visible');
  pendingAction = null;
});

/* ── HV API call ── */
let _cmdInFlight = false;  // 명령 실행 중 → auto-refresh 건너뜀

// 명령 완료 후 갱신은 자동 갱신 인터벌에 맡김 (별도 타이머 없음)
function scheduleRefresh() { /* no-op: setInterval이 다음 틱에 자동 갱신 */ }

async function _sendHV(command, channels, value) {
  const body = { command, channels };
  if (command === 'voltage') body.voltage = value;
  if (command === 'i0set')   body.current = value;
  if (command === 'svmax')   body.svmax   = value;
  if (command === 'rup')     body.rup     = value;
  if (command === 'rdown')   body.rdown   = value;
  if (command === 'name')    body.name    = value;
  const res = await fetch('/api/hv/set', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
}

/* ── On/Off 배칭: 300ms 안에 들어온 명령을 모아 SSH 1번으로 처리 ── */
const _onOffBatch = { on: new Set(), off: new Set() };
let _batchTimer = null;

async function _flushOnOff() {
  _batchTimer = null;
  const toOn  = [..._onOffBatch.on];
  const toOff = [..._onOffBatch.off];
  _onOffBatch.on.clear();
  _onOffBatch.off.clear();
  _cmdInFlight = true;
  try {
    if (toOff.length) await _sendHV('off', toOff);
    if (toOn.length)  await _sendHV('on',  toOn);
    showToast(`✓ ${toOff.length ? 'off ' + toOff.join(',') : ''}${toOn.length ? '  on ' + toOn.join(',') : ''}`.trim(), 'ok');
    scheduleRefresh();
  } catch (e) {
    showToast(`✗ 오류: ${e.message}`, 'error');
  } finally {
    _cmdInFlight = false;
  }
}

async function applyHV(command, channels, value) {
  if (command === 'on' || command === 'off') {
    const opposite = command === 'on' ? 'off' : 'on';
    channels.forEach(ch => { _onOffBatch[opposite].delete(ch); _onOffBatch[command].add(ch); });
    if (_batchTimer) clearTimeout(_batchTimer);
    _batchTimer = setTimeout(_flushOnOff, 300);
    return;
  }
  // voltage / i0set: 즉시 전송
  _cmdInFlight = true;
  try {
    await _sendHV(command, channels, value);
    showToast(`✓ ${command} ${Array.isArray(channels) ? channels.join(',') : channels}`, 'ok');
    scheduleRefresh();
  } catch (e) {
    showToast(`✗ 오류: ${e.message}`, 'error');
  } finally {
    _cmdInFlight = false;
  }
}

/* ── Global keyboard navigation ── */
document.addEventListener('keydown', e => {
  const inp = document.querySelector('input.inline-edit');

  // 위/아래 화살표: 행 이동 (편집 중에도 동작 — 현재 편집 먼저 커밋)
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    // 편집 중이면 inline input keydown에서 처리 (중복 방지)
    if (inp) return;
    e.preventDefault();
    if (focusedRowIdx < 0) { focusCell(0, focusedColKey); return; }
    focusCell(focusedRowIdx + (e.key === 'ArrowDown' ? 1 : -1), focusedColKey);
    return;
  }

  // 좌/우 화살표: 편집 가능 컬럼 간 이동
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (inp) return;
    e.preventDefault();
    const navCols = expertMode ? COL_NAV_EXPERT : COL_NAV_NORMAL;
    const curIdx  = navCols.indexOf(focusedColKey);
    const nextIdx = curIdx + (e.key === 'ArrowRight' ? 1 : -1);
    if (nextIdx < 0 || nextIdx >= navCols.length) return;
    focusCell(focusedRowIdx < 0 ? 0 : focusedRowIdx, navCols[nextIdx]);
    return;
  }

  // 스페이스바 / 엔터: 포커스된 셀 액션 실행
  if ((e.key === ' ' || e.key === 'Enter') && !inp) {
    const active = document.activeElement;
    if (active && active._action) {
      e.preventDefault();
      active._action();
    }
  }
});

/* ── View toggle ── */
viewBtn.addEventListener('click', () => {
  showRaw = !showRaw;
  viewBtn.textContent = showRaw ? '표 보기' : 'Raw 보기';
  render();
});

function render() {
  if (!lastRaw) return;
  // Don't re-render while user is actively typing in an inline input
  if (document.querySelector('input.inline-edit')) return;
  if (showRaw || !lastRows) {
    tblWrap.style.display = 'none';
    rawEl.style.display   = 'block';
    rawEl.textContent     = lastRaw;
    msgEl.style.display   = 'none';
  } else {
    rawEl.style.display   = 'none';
    tblWrap.style.display = 'block';
    msgEl.style.display   = 'none';
    renderTable(lastRows);
  }
}

/* ── Table rendering ── */
function renderTable(rows) {
  if (document.querySelector('input.inline-edit')) return;
  tbody.innerHTML = '';

  const makeStatusBadge = (s, rawStatus) => {
    if (s === 'on')   return '<span class="badge badge-on"><span class="dot dot-on"></span>On</span>';
    if (s === 'off')  return '<span class="badge badge-off"><span class="dot dot-off"></span>Off</span>';
    if (s === 'up')   return '<span class="badge badge-up"><span class="dot dot-up"></span>Up</span>';
    if (s === 'down') return '<span class="badge badge-down"><span class="dot dot-down"></span>Down</span>';
    if (isTrip(s))    return `<span class="badge badge-trip"><span class="dot dot-trip"></span>${rawStatus || 'Trip'}</span>`;
    return `<span class="badge badge-unk"><span class="dot dot-unk"></span>${rawStatus || '-'}</span>`;
  };

  const makeInlineEdit = (td, opts) => {
    /* opts: { cur, step, min, max, type, onCommit(v) } */
    if (td.querySelector('input')) return;
    const cur = opts.cur;
    const isText = opts.type === 'text';
    td.textContent = '';
    const inp = document.createElement('input');
    inp.className = 'inline-edit';
    if (isText) {
      inp.type = 'text';
    } else {
      inp.type = 'number';
      inp.step  = opts.step  || '1';
      inp.min   = opts.min   !== undefined ? opts.min : '0';
      if (opts.max !== undefined) inp.max = opts.max;
    }
    inp.value = cur !== '-' ? cur : '';
    td.appendChild(inp);
    inp.focus(); inp.select();

    const commit = () => {
      const raw = inp.value.trim();
      td.textContent = raw !== '' ? raw : cur;
      if (isText) {
        if (raw !== '' && raw !== cur) opts.onCommit(raw);
      } else {
        const v = parseFloat(inp.value);
        if (!isNaN(v) && raw !== cur) opts.onCommit(v);
      }
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); inp.blur(); }
      if (e.key === 'Escape') { td.textContent = cur; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        inp.blur();
        focusCell(focusedRowIdx + (e.key === 'ArrowDown' ? 1 : -1), focusedColKey);
      }
    });
  };

  rows.forEach((r, rowIdx) => {
    const tr = document.createElement('tr');
    const st = (r.status || '').toLowerCase();
    if (isAlertSt(st)) tr.classList.add('trip-row');

    // Ch
    const tdCh = document.createElement('td');
    tdCh.textContent = r.ch_label || '-';
    tr.appendChild(tdCh);

    // Name
    const tdName = document.createElement('td');
    if (editMode) {
      tdName.className = 'v0set-cell';
      tdName.tabIndex = 0;
      tdName.title = 'Space / Enter / 더블클릭: 이름 편집';
      tdName.textContent = r.name || '-';
      const openName = () => makeInlineEdit(tdName, {
        cur: tdName.textContent.replace(' ✎', '').trim(),
        type: 'text',
        onCommit: v => applyHV('name', [r.chan], v),
      });
      tdName._action = openName;
      tdName.addEventListener('dblclick', openName);
      tdName.addEventListener('focus', () => { focusedRowIdx = rowIdx; focusedColKey = 'name'; });
    } else {
      tdName.textContent = r.name || '-';
    }
    tr.appendChild(tdName);

    // Status
    const tdSt = document.createElement('td');
    tdSt.innerHTML = makeStatusBadge(st, r.status);
    if (editMode && (st === 'on' || st === 'off' || st === 'up' || st === 'down' || isAlertSt(st))) {
      tdSt.className = 'status-edit';
      tdSt.tabIndex = 0;
      const stParts = st.split('+').map(c => c.trim());
      const isOnLike = stParts.some(c => c === 'on' || c === 'up');
      tdSt.title = isOnLike ? 'Space / Enter: Off' : 'Space / Enter: On';
      const toggle = () => {
        const chName = r.name && r.name !== '-' ? r.name : `${r.crate}:${r.chan}`;
        applyHV(isOnLike ? 'off' : 'on', [chName]);
      };
      tdSt._action = toggle;
      tdSt.addEventListener('click', () => { tdSt.focus(); });
      tdSt.addEventListener('focus', () => { focusedRowIdx = rowIdx; focusedColKey = 'status'; });
    }
    tr.appendChild(tdSt);

    // VMon
    const vmon  = parseFloat(r.vmon);
    const v0set = parseFloat(r.v0set);
    const tdVMon = document.createElement('td');
    if (!isNaN(vmon) && !isNaN(v0set)) {
      const diff = Math.abs(vmon - v0set);
      tdVMon.textContent = vmon.toFixed(2);
      tdVMon.className = diff > 5 ? 'vmon-warn' : 'vmon-ok';
      if (diff > 5) tdVMon.title = `V0Set: ${v0set} · 차이: ${diff.toFixed(1)} V`;
    } else {
      tdVMon.textContent = r.vmon || '-';
    }
    tr.appendChild(tdVMon);

    // IMon
    const tdIMon = document.createElement('td');
    const imon = parseFloat(r.imon);
    tdIMon.textContent = !isNaN(imon) ? imon.toFixed(3) : (r.imon || '-');
    tr.appendChild(tdIMon);

    // V0Set
    const tdV0Set = document.createElement('td');
    if (editMode) {
      tdV0Set.className = 'v0set-cell';
      tdV0Set.tabIndex = 0;
      tdV0Set.title = 'Space / Enter / 더블클릭: 편집';
      tdV0Set.textContent = r.v0set || '-';
      const openV0 = () => makeInlineEdit(tdV0Set, {
        cur: tdV0Set.textContent.replace(' ✎', '').trim(),
        step: '1', min: 0, max: 2000,
        onCommit: v => {
          const ch = r.name && r.name !== '-' ? r.name : `${r.crate}:${r.chan}`;
          applyHV('voltage', [ch], v);
        },
      });
      tdV0Set._action = openV0;
      tdV0Set.addEventListener('dblclick', openV0);
      tdV0Set.addEventListener('focus', () => { focusedRowIdx = rowIdx; focusedColKey = 'v0set'; });
    } else {
      tdV0Set.textContent = r.v0set || '-';
    }
    tr.appendChild(tdV0Set);

    // I0Set
    const tdI0Set = document.createElement('td');
    if (editMode) {
      tdI0Set.className = 'v0set-cell';
      tdI0Set.tabIndex = 0;
      tdI0Set.title = 'Space / Enter / 더블클릭: 편집';
      tdI0Set.textContent = r.i0set || '-';
      const openI0 = () => makeInlineEdit(tdI0Set, {
        cur: tdI0Set.textContent.replace(' ✎', '').trim(),
        step: '0.001', min: 0,
        onCommit: v => {
          const ch = r.name && r.name !== '-' ? r.name : `${r.crate}:${r.chan}`;
          applyHV('i0set', [ch], v);
        },
      });
      tdI0Set._action = openI0;
      tdI0Set.addEventListener('dblclick', openI0);
      tdI0Set.addEventListener('focus', () => { focusedRowIdx = rowIdx; focusedColKey = 'i0set'; });
    } else {
      tdI0Set.textContent = r.i0set || '-';
    }
    tr.appendChild(tdI0Set);

    // Expert columns
    const tdRUp = document.createElement('td');
    if (expertMode) {
      tdRUp.className = 'expert-col v0set-cell';
      tdRUp.tabIndex = 0;
      tdRUp.title = 'Space / Enter / 더블클릭: RampUp 편집';
      tdRUp.textContent = r.rup || '-';
      const openRUp = () => makeInlineEdit(tdRUp, {
        cur: tdRUp.textContent.replace(' ✎', '').trim(),
        step: '1', min: 0,
        onCommit: v => {
          const ch = r.name && r.name !== '-' ? r.name : `${r.crate}:${r.chan}`;
          applyHV('rup', [ch], v);
        },
      });
      tdRUp._action = openRUp;
      tdRUp.addEventListener('dblclick', openRUp);
      tdRUp.addEventListener('focus', () => { focusedRowIdx = rowIdx; focusedColKey = 'rup'; });
    } else {
      tdRUp.className = 'expert-col hidden';
      tdRUp.textContent = r.rup || '-';
    }
    tr.appendChild(tdRUp);

    const tdRDown = document.createElement('td');
    if (expertMode) {
      tdRDown.className = 'expert-col v0set-cell';
      tdRDown.tabIndex = 0;
      tdRDown.title = 'Space / Enter / 더블클릭: RampDown 편집';
      tdRDown.textContent = r.rdown || '-';
      const openRDown = () => makeInlineEdit(tdRDown, {
        cur: tdRDown.textContent.replace(' ✎', '').trim(),
        step: '1', min: 0,
        onCommit: v => {
          const ch = r.name && r.name !== '-' ? r.name : `${r.crate}:${r.chan}`;
          applyHV('rdown', [ch], v);
        },
      });
      tdRDown._action = openRDown;
      tdRDown.addEventListener('dblclick', openRDown);
      tdRDown.addEventListener('focus', () => { focusedRowIdx = rowIdx; focusedColKey = 'rdown'; });
    } else {
      tdRDown.className = 'expert-col hidden';
      tdRDown.textContent = r.rdown || '-';
    }
    tr.appendChild(tdRDown);

    const tdVMax = document.createElement('td');
    if (expertMode) {
      tdVMax.className = 'expert-col v0set-cell';
      tdVMax.tabIndex = 0;
      tdVMax.title = 'Space / Enter / 더블클릭: SVMax 편집';
      tdVMax.textContent = r.vmax || '-';
      const openVMax = () => makeInlineEdit(tdVMax, {
        cur: tdVMax.textContent.replace(' ✎', '').trim(),
        step: '1', min: 0,
        onCommit: v => {
          const ch = r.name && r.name !== '-' ? r.name : `${r.crate}:${r.chan}`;
          applyHV('svmax', [ch], v);
        },
      });
      tdVMax._action = openVMax;
      tdVMax.addEventListener('dblclick', openVMax);
      tdVMax.addEventListener('focus', () => { focusedRowIdx = rowIdx; focusedColKey = 'vmax'; });
    } else {
      tdVMax.className = 'expert-col hidden';
      tdVMax.textContent = r.vmax || '-';
    }
    tr.appendChild(tdVMax);

    tbody.appendChild(tr);
  });

  // 편집 모드에서 이전 포커스 위치 복원
  if (editMode && focusedRowIdx >= 0) {
    requestAnimationFrame(() => focusCell(focusedRowIdx, focusedColKey));
  }
}

/* ── Parser ──
   HVWrappdemo --Status --VMon --IMon --V0Set --I0Set 출력에서
   "📄 Output:" 이후 섹션을 파싱.
*/
function parseHvOutput(raw) {
  const outMarker = '📄 Output:';
  const markerIdx = raw.indexOf(outMarker);
  const section = markerIdx >= 0 ? raw.slice(markerIdx + outMarker.length) : raw;

  const lines = section
    .split('\n')
    .map(l => l.trim())
    .filter(l => l)
    .filter(l => !/^(📊|📋|💻|⏰|⚠️|❌)/.test(l))
    .filter(l => !/^command\s*:/i.test(l));

  if (!lines.length) return null;

  const rows = [];
  const headerRe = /^(\d{1,2})-(\d{1,2})\s+\(([^)]*)\)\s+Status\s*=\s*(.+?)(?=\s+\w+\s*=|$)/i;

  const pickField = (line, key) => {
    const re = new RegExp(key + '\\s*=\\s*([+-]?\\d+(?:\\.\\d+)?)', 'i');
    const mm = line.match(re);
    return mm ? mm[1] : '-';
  };

  for (const line of lines) {
    const m = line.match(headerRe);
    if (!m) continue;

    const crate = parseInt(m[1], 10);
    const chan = parseInt(m[2], 10);
    const name = m[3] && m[3] !== 'None' ? m[3] : '-';
    const status = m[4];

    rows.push({
      crate,
      chan,
      ch_label: `${crate}-${String(chan).padStart(2, '0')}`,
      name,
      status,
      vmon:  pickField(line, 'VMon'),
      imon:  pickField(line, 'IMon'),
      v0set: pickField(line, 'V0Set'),
      i0set: pickField(line, 'I0Set'),
      rup:   pickField(line, 'RUp'),
      rdown: pickField(line, 'RDWn'),
      vmax:  pickField(line, 'SVMax'),
    });
  }

  if (!rows.length) return null;
  rows.sort((a, b) => (a.crate - b.crate) || (a.chan - b.chan));
  return rows;
}

/* ── Fetch ── */
async function loadStatus() {
  if (_cmdInFlight) return;  // 명령 실행 중이면 이번 틱 건너뜀
  try {
    const res  = await fetch('/api/hv/status-all?t=' + Date.now() + (expertMode ? '&expert=1' : ''));
    const data = await res.json();
    if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);

    lastRaw  = data.output || '(출력 없음)';
    lastRows = parseHvOutput(lastRaw);
    detectTransitions(lastRows);

    tsEl.textContent = '마지막: ' + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    msgEl.textContent  = '조회 실패: ' + e.message;
    msgEl.className    = 'error';
    msgEl.style.display = 'block';
    tblWrap.style.display = 'none';
    rawEl.style.display   = 'none';
    tsEl.textContent = '오류';
  }
}

function setExpertColumnsVisible(visible) {
  document.querySelectorAll('th.expert-col').forEach(el => {
    el.classList.toggle('hidden', !visible);
  });
}

/* ── Auto-refresh ── */
function applyAutoInterval(ms) {
  autoMs = ms;
  autoIdx = AUTO_CHOICES.indexOf(ms);
  if (timerAuto) {
    clearInterval(timerAuto);
    timerAuto = null;
  }
  timerAuto = setInterval(loadStatus, autoMs);
  autoBtn.textContent = `자동 갱신: ${autoMs / 1000}초`;
  autoBtn.classList.add('active');
}

refreshBtn.addEventListener('click', loadStatus);
autoBtn.addEventListener('click', () => {
  const nextIdx = (autoIdx + 1) % AUTO_CHOICES.length;
  applyAutoInterval(AUTO_CHOICES[nextIdx]);
  loadStatus();
});
expertBtn.addEventListener('click', () => {
  expertMode = !expertMode;
  expertBtn.textContent = expertMode ? '전문가모드: 켜짐' : '전문가모드: 꺼짐';
  expertBtn.classList.toggle('active', expertMode);
  setExpertColumnsVisible(expertMode);
  loadStatus();
});

/* ── Hodoscope HV card ── */
const hodoValEl = document.getElementById('hodo-val');

async function loadHodoscopeHV() {
  try {
    const res  = await fetch('/api/hv/hodoscope?t=' + Date.now());
    const data = await res.json();
    if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
    const hv = parseFloat(data.hv);
    if (hv === 0.0) {
      hodoValEl.innerHTML = '<span style="color:#ef5350">Off (0.0 V)</span>';
    } else {
      hodoValEl.innerHTML = `<span style="color:#81c784">${hv} V</span>`;
    }
  } catch (e) {
    hodoValEl.innerHTML = `<span style="color:#ef5350">읽기 실패: ${e.message}</span>`;
  }
}

/* ── Init ── */
setExpertColumnsVisible(false);
loadStatus();
loadHodoscopeHV();
applyAutoInterval(autoMs);

setInterval(loadHodoscopeHV, autoMs);

/* ─── Trip / Ramp-Complete Alerts ─────────────────────────── */

const HV_AUDIO_TRIP = '/static/audio/trip.mp3';
const HV_AUDIO_RAMP = '/static/audio/ramp.mp3';

function _playHvSound(src) {
  const a = new Audio(src);
  a.play().catch(() => {});
}

(function () {
  const unlock = () => {
    [HV_AUDIO_TRIP, HV_AUDIO_RAMP].forEach(src => {
      const a = new Audio(src);
      a.volume = 0;
      a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
    });
    document.removeEventListener('click',   unlock);
    document.removeEventListener('keydown', unlock);
  };
  document.addEventListener('click',   unlock);
  document.addEventListener('keydown', unlock);
})();

const tripBanner      = document.getElementById('trip-banner');
const tripBannerLabel = document.getElementById('trip-banner-label');
const tripBannerCh    = document.getElementById('trip-banner-channels');
const tripBannerClose = document.getElementById('trip-banner-close');
let   tripDismissed   = false;

tripBannerClose.addEventListener('click', () => {
  tripBanner.classList.remove('visible');
  tripDismissed = true;
});

let prevHvMap   = {};
let hvFirstLoad = true;

function detectTransitions(newRows) {
  if (!newRows || !newRows.length) return;

  const newMap = {};
  for (const r of newRows) {
    newMap[r.ch_label] = {
      status: (r.status || '').toLowerCase(),
      name:   r.name && r.name !== '-' ? r.name : r.chan,
    };
  }


  const currentAlerts = [];
  let newAlertFound = false;
  let rampUpDone    = false;
  let rampDwnDone   = false;

  for (const [key, curr] of Object.entries(newMap)) {
    const prev   = prevHvMap[key];
    const prevSt = prev ? prev.status : null;
    const currSt = curr.status;

    if (isAlertSt(currSt)) {
      const parts = alertParts(currSt);
      currentAlerts.push({ name: curr.name, status: parts.join('+') });
      if (!hvFirstLoad && !isAlertSt(prevSt)) newAlertFound = true;
    }

    if (!hvFirstLoad) {
      if (prevSt === 'up'   && currSt === 'on')  rampUpDone  = true;
      if (prevSt === 'down' && (currSt === 'on' || currSt === 'off')) rampDwnDone = true;
    }
  }

  hvFirstLoad = false;

  if (currentAlerts.length > 0) {
    // status를 + 기준으로 분리 → 모든 활성 조건 수집 (중복 제거)
    const allConditions = [...new Set(
      currentAlerts.flatMap(a => a.status.split('+').map(c => c.trim()))
    )];
    tripBannerLabel.textContent = allConditions.join(' + ') + ' 발생!';
    // 채널별로 조건 표시: "T1C(Over Current+Internal Trip)"
    tripBannerCh.textContent = currentAlerts
      .map(a => `${a.name}(${a.status})`)
      .join('  ·  ');
    if (newAlertFound) {
      tripDismissed = false;
      _playHvSound(HV_AUDIO_TRIP);
    }
    if (!tripDismissed) tripBanner.classList.add('visible');
  } else {
    tripBanner.classList.remove('visible');
    tripDismissed = false;
  }

  if (rampUpDone || rampDwnDone) _playHvSound(HV_AUDIO_RAMP);

  prevHvMap = newMap;
}
